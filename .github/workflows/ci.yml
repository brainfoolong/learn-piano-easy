# Checks every push and pull request, and deploys the site to GitHub Pages from a push to main once every
# check has passed. A newer push to the same branch cancels the run before it, so only the newest deploys.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          # Keep in step with package.json's engines.bun.
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun x tsc
      - run: bun test
      # The site's address gives every page its canonical and hreflang links.
      - run: bun run build --site-url https://learn-piano-easy.app/
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The image carries Chromium and its system libraries, so the job downloads no browser. Its tag is
    # package.json's @playwright/test version, and tools/ci.test.ts fails when the two differ.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    # Chromium draws WebGL in software here, so each runner drives one browser. The shards run the suite
    # on four runners at once.
    strategy:
      fail-fast: true
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      # The image has no unzip for setup-bun, so Bun comes from npm. Keep in step with engines.bun.
      - run: npm install --global bun@1.4.4
      - run: bun install --frozen-lockfile
      - run: bun x playwright test --shard ${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-results-${{ matrix.shard }}
          path: .agent-tmp/e2e/runs/
          include-hidden-files: true

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
